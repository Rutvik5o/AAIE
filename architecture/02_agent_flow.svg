2340" text-anchor="middle" style="white-space:pre">another student&#x27;s ID mentioned → access_denied audit</text><polyline points="480,379 480,401" fill="none" stroke="#8a93b0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="263.0" y="407" width="440" height="124" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="260.0" y="403" width="440" height="124" rx="14" fill="#eef1ff" stroke="#4f46e5" stroke-width="1.6"/><rect x="260.0" y="415" width="4" height="100" rx="2" fill="#4f46e5"/><text x="480.0" y="430" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle" style="white-space:pre">④  Context selection   (loop.py · prompts.py)</text><text x="480.0" y="452" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="middle" style="white-space:pre">remembered facts for this student</text><text x="480.0" y="471" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="middle" style="white-space:pre">top-3 handbook chunks (TF-IDF, score ≥ 0.08)</text><text x="480.0" y="490" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="middle" style="white-space:pre">last 6 messages + student profile + today&#x27;s date</text><text x="480.0" y="509" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="middle" style="white-space:pre">→ build_system_prompt()</text><polyline points="480,527 480,549" fill="none" stroke="#8a93b0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="263.0" y="555" width="440" height="66" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="260.0" y="551" width="440" height="66" rx="14" fill="#fcf2ff" stroke="#c026d3" stroke-width="1.6"/><rect x="260.0" y="563" width="4" height="42" 