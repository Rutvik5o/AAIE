<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93b0"/></marker><linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect x="0" y="0" width="1400" height="880" rx="0" fill="#ffffff" stroke="none" stroke-width="1.6"/><rect x="0" y="0" width="1400" height="6" fill="url(#brand)"/><text x="40" y="50" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e2340" text-anchor="start" style="white-space:pre">3 · Memory, Retrieval &amp; Context Selection</text><text x="40" y="76" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6380" text-anchor="start" style="white-space:pre">Only what is relevant goes into the prompt; sensitive data and other students&#x27; data never do</text><text x="1360" y="862" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a93b0" text-anchor="end" style="white-space:pre">Campus Assist · AI Student Support Agent · AAIE Assignment 1</text><rect x="43" y="109" width="600" height="230" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="40" y="105" width="600" height="230" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><rect x="40" y="117" width="4" height="206" rx="2" fill="#059669"/><text x="58" y="132" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46" text-anchor="start" style="white-space:pre">Long-term memory   (agent/memory.py → memory/memory.json)</text><rect x="63" y="154" width="165" height="60" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="60" y="150" width="165" height="60" rx="14" fill="#fff8eb" stroke="#d97706" stroke-width="1.6"/><rect x="60" y="162" width="4" height="36" rx="2" fill="#d97706"/><text x="142.5" y="177" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle" style="white-space:pre">save_memory tool</text><text x="142.5" y="199" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="middle" style="white-space:pre">facts: [{key, value}]</text><polyline points="225,180 253,180" fill="none" stroke="#8a93b0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="258" y="154" width="150" height="60" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="255" y="150" width="150" height="60" rx="14" fill="#fff1f3" stroke="#e11d48" stroke-width="1.6"/><rect x="255" y="162" width="4" height="36" rx="2" fill="#e11d48"/><text x="330.0" y="177" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#a3102f" text-anchor="middle" style="white-space:pre">check() filter</text><text x="330.0" y="199" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="middle" style="white-space:pre">sensitive? temporary?</text><polyline points="405,180 433,180" fill="none" stroke="#8a93b0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="438" y="154" width="185" height="60" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="435" y="150" width="185" height="60" rx="14" fill="#f2f4f8" stroke="#64748b" stroke-width="1.6"/><rect x="435" y="162" width="4" height="36" rx="2" fill="#64748b"/><text x="527.5" y="177" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle" style="white-space:pre">memory.json</text><text x="527.5" y="199" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="middle" style="white-space:pre">per student, survives restart</text><text x="62" y="240" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#065f46" text-anchor="start" style="white-space:pre">✓ stored:   programme = MBA · contact_preference = email</text><text x="62" y="264" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9f1239" text-anchor="start" style="white-space:pre">✗ blocked:  card numbers, ID numbers, password / PIN / OTP / CVV,</text><text x="62" y="283" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9f1239" text-anchor="start" style="white-space:pre">                 bank details, health information</text><text x="62" y="307" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9f1239" text-anchor="start" style="white-space:pre">✗ blocked:  temporary context: today, right now, feeling, stressed …</text><rect x="43" y="359" width="600" height="250" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="40" y="355" width="600" height="250" rx="14" fill="#eef1ff" stroke="#4f46e5" stroke-width="1.6"/><rect x="40" y="367" width="4" height="226" rx="2" fill="#4f46e5"/><text x="58" y="382" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#3730a3" text-anchor="start" style="white-space:pre">Retrieval   (agent/retriever.py)</text><rect x="63" y="404" width="130" height="66" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="60" y="400" width="130" height="66" rx="14" fill="#f2f4f8" stroke="#64748b" stroke-width="1.6"/><rect x="60" y="412" width="4" height="42" rx="2" fill="#64748b"/><text x="125.0" y="427" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle" style="white-space:pre">handbook.md</text><text x="125.0" y="449" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="middle" style="white-space:pre">22 sections · ≈4.9k tok</text><polyline points="190,433 203,433" fill="none" stroke="#8a93b0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="208" y="404" width="130" height="66" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="205" y="400" width="130" height="66" rx="14" fill="#f2f4f8" stroke="#64748b" stroke-width="1.6"/><rect x="205" y="412" width="4" height="42" rx="2" fill="#64748b"/><text x="270.0" y="427" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle" style="white-space:pre">split on &#x27;## &#x27;</text><text x="270.0" y="449" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="middle" style="white-space:pre">chunk-01 … 22</text><polyline points="335,433 348,433" fill="none" stroke="#8a93b0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="353" y="404" width="130" height="66" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="350" y="400" width="130" height="66" rx="14" fill="#f2f4f8" stroke="#64748b" stroke-width="1.6"/><rect x="350" y="412" width="4" height="42" rx="2" fill="#64748b"/><text x="415.0" y="427" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle" style="white-space:pre">TF-IDF</text><text x="415.0" y="449" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="middle" style="white-space:pre">1–2 grams, title ×2</text><polyline points="480,433 493,433" fill="none" stroke="#8a93b0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="498" y="404" width="130" height="66" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="495" y="400" width="130" height="66" rx="14" fill="#f2f4f8" stroke="#64748b" stroke-width="1.6"/><rect x="495" y="412" width="4" height="42" rx="2" fill="#64748b"/><text x="560.0" y="427" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle" style="white-space:pre">cosine</text><text x="560.0" y="449" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="middle" style="white-space:pre">top-3, score ≥ 0.08</text><text x="62" y="500" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">Example:  &quot;The payment portal failed, can I pay on the next working day?&quot;</text><text x="62" y="522" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3730a3" text-anchor="start" style="white-space:pre">→ chunk-05 Payment Portal Failures (0.26) · chunk-06 Late Payment Fees (0.16) · chunk-20 (0.10)</text><text x="62" y="552" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6380" text-anchor="start" style="white-space:pre">Only the top-k chunks are sent (≈210 tokens each), never the whole handbook.</text><text x="62" y="574" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6380" text-anchor="start" style="white-space:pre">Not in the handbook (e.g. pet policy) → weak matches → agent says it doesn&#x27;t know.</text><rect x="43" y="629" width="600" height="150" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="40" y="625" width="600" height="150" rx="14" fill="#f4f1ff" stroke="#7c5cff" stroke-width="1.6"/><rect x="40" y="637" width="4" height="126" rx="2" fill="#7c5cff"/><text x="58" y="652" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#4c35c9" text-anchor="start" style="white-space:pre">Short-term context (session)</text><text x="58" y="674" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">last 6 messages of this session  (HISTORY_TURNS = 6)</text><text x="58" y="693" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">New session → empty history, but memory is still loaded</text><text x="58" y="712" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">+ student profile (name, programme) from students.json</text><text x="58" y="731" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">+ today&#x27;s date (for due-date questions)</text><rect x="723" y="254" width="300" height="330" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="720" y="250" width="300" height="330" rx="14" fill="#eef1ff" stroke="#4f46e5" stroke-width="1.6"/><rect x="720" y="262" width="4" height="306" rx="2" fill="#4f46e5"/><text x="738" y="277" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#3730a3" text-anchor="start" style="white-space:pre">build_system_prompt()</text><text x="738" y="299" font-family="Consolas, JetBrains Mono, monospace" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start" style="white-space:pre">agent/prompts.py</text><text x="738" y="318" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre"></text><text x="738" y="337" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">1  Rules</text><text x="738" y="356" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">    · tools for live data</text><text x="738" y="375" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">    · policy only from excerpts</text><text x="738" y="394" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">    · say &quot;I don&#x27;t know&quot; + offer ticket</text><text x="738" y="413" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">    · refuse other students&#x27; data</text><text x="738" y="432" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">    · never save sensitive info</text><text x="738" y="451" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">2  Student profile</text><text x="738" y="470" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">3  Remembered facts</text><text x="738" y="489" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">4  Policy excerpts (top-3)</text><text x="738" y="508" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">5  Today&#x27;s date</text><text x="738" y="527" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">+ history + redacted message</text><polyline points="640,220 680,220 680,415 718,415" fill="none" stroke="#8a93b0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="640,480 680,480 680,415 718,415" fill="none" stroke="#8a93b0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="640,700 680,700 680,415 718,415" fill="none" stroke="#8a93b0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1020,415 1078,415" fill="none" stroke="#8a93b0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1083" y="334" width="280" height="170" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="1080" y="330" width="280" height="170" rx="14" fill="#fcf2ff" stroke="#c026d3" stroke-width="1.6"/><rect x="1080" y="342" width="4" height="146" rx="2" fill="#c026d3"/><text x="1098" y="357" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#86198f" text-anchor="start" style="white-space:pre">LLM (Groq)</text><text x="1098" y="379" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">openai/gpt-oss-120b</text><text x="1098" y="398" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre"></text><text x="1098" y="417" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">≈1,680 input tokens / request</text><text x="1098" y="436" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">(prompt + tool schemas)</text><text x="1098" y="455" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">vs ≈4,900 tokens for the</text><text x="1098" y="474" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">handbook alone</text><rect x="723" y="624" width="640" height="155" rx="14" fill="#1e234014" stroke="none" stroke-width="1.6"/><rect x="720" y="620" width="640" height="155" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/><rect x="720" y="632" width="4" height="131" rx="2" fill="#e11d48"/><text x="738" y="647" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#9f1239" text-anchor="start" style="white-space:pre">Kept OUT of the prompt</text><text x="738" y="669" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">Fee and scholarship data → fetched only through tools when needed</text><text x="738" y="688" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">Other students&#x27; records → run_tool() returns &#x27;Access denied&#x27; + audit</text><text x="738" y="707" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">Card numbers / OTPs → redacted before the LLM and the logs</text><text x="738" y="726" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2340" text-anchor="start" style="white-space:pre">Old turns beyond the last 6 → dropped</text></svg>